{% extends "base.html" %} {% block title %}<title>Crear Material</title> {%
endblock %} {% block stylesheets %}
<link
	rel="stylesheet"
	href="{{url_for('static', filename='styles/estilos_form.css')}}"
/>
{% endblock %} {% block body %}
<form action="ingresoMaterial" method="post">
	<div class="contenedor-info">
		<div class="titulo">
			<header>
				<h1>Crear Material</h1>
			</header>
		</div>
		<!-- cambiar name y en css -->
		<div class="id-pedido">
			<!-- aqui va el nombre del usuario que esta creando el material -->
			<p>Nombre usuario</p>
		</div>
	</div>
	<div class="contenido">
		<div class="Formulario">
			<input
				class="materiales"
				type="text"
				name="codigo_material"
				id="codigo-material"
				placeholder="Código"
			/>
			<input
				class="materiales"
				type="text"
				name="num_lote"
				id="lot-number"
				placeholder="No. Lote"
			/>
			<br />
			<input
				class="materiales"
				type="text"
				name="producto"
				id="product"
				placeholder="Producto"
			/><br />
			<input
				class="materiales"
				type="text"
				name="proveedor"
				id="supplier"
				placeholder="Proveedor"
			/><br />

			<input
				class="materiales"
				type="number"
				name="amount"
				id="amount"
				placeholder="Cantidad"
			/>
			<select class="materiales" name="unidad" id="unit">
				<option selected value="">Unidad</option>
				{% for um in u_m %}
				<option value="{{um.value}}">{{um.name}}</option>
				{% endfor %}
			</select>
			<input
				class="materiales"
				type="text"
				name="color"
				id="color"
				placeholder="Color"
			/>

			<select class="materiales" name="estado_material" id="estado-material">
				<option selected value="">Estado material</option>
				{% for estado in estadoMaterial %}
				<option value="{{estado.id}}">
					{{estado.estado_material.name}}
				</option>
				{% endfor %}
			</select>
			<br />

			<textarea
				name="description"
				id="description"
				cols="30"
				rows="10"
				placeholder="Descripción"
			></textarea>
		</div>
	</div>
	<button type="submit">Registrar</button>
</form>
{% endblock %}
